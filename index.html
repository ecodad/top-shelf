<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Top Shelf</title>
<meta name="description" content="Slide drinks down the bar and merge them into bigger ones.">
<meta name="theme-color" content="#07061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Top Shelf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  html, body {
    margin: 0; height: 100%; background: #07061a; color: #fff; overflow: hidden;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Avenir Next", "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  #game { position: fixed; left: 0; top: 0; width: 100%; height: var(--app-h, 100%); display: block; touch-action: none; }
  #probe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }

  #btnPause {
    position: fixed; z-index: 3; border-radius: 50%; border: 2px solid #ffc93c; padding: 0;
    background: rgba(10, 8, 34, 0.72); color: #fff; font-weight: 900; line-height: 1; letter-spacing: 1px;
  }
  #btnPause[hidden], #btnShake[hidden], .btn[hidden] { display: none; }
  #btnShake {
    position: fixed; z-index: 3; border-radius: 50%; border: 2px solid #9be7ff; padding: 0;
    background: rgba(10, 8, 34, 0.78); color: #fff; font: inherit; font-weight: 800; line-height: 1.15;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(90, 200, 255, 0.45);
  }
  #btnShake b { font-size: 1.25em; color: #9be7ff; }
  #btnShake:disabled { opacity: 0.4; box-shadow: none; }
  #btnShake:active { transform: scale(0.94); }
  .levels { display: flex; justify-content: center; gap: 9px; margin-top: 12px; }
  .lv {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.5); padding: 0;
    background: rgba(255, 255, 255, 0.1); color: #fff; font: inherit; font-size: 16px; font-weight: 900;
  }
  .lv.on { border-color: #ffc93c; background: #ffc93c; color: #2a0f1f; }
  .lv:disabled { opacity: 0.32; }

  .overlay {
    position: fixed; left: 0; top: 0; width: 100%; height: var(--app-h, 100%); box-sizing: border-box;
    z-index: 5; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    padding: calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 24px);
    background: rgba(7, 6, 26, 0.74); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }
  .overlay.clear { background: rgba(7, 6, 26, 0.5); -webkit-backdrop-filter: none; backdrop-filter: none; }

  h1.neon {
    margin: 0; font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
    font-weight: 900; font-size: min(22vw, 96px); line-height: 1.05; color: #fff0f8;
    text-shadow: 0 0 6px #fff, 0 0 18px #ff4fa3, 0 0 42px #ff4fa3, 0 0 80px #b6127a;
  }
  .tag { margin: -4px 0 10px; letter-spacing: 0.32em; font-weight: 700; font-size: 13px; color: #9be7ff; text-transform: uppercase; }
  h2 { margin: 0; font-size: 40px; font-weight: 900; }
  h2.gold { font-size: 46px; color: #ffd43b; text-shadow: 0 3px 0 #1b1f45, 0 0 28px rgba(255, 201, 60, 0.7); }
  .overlay p { margin: 0; font-size: 16px; color: rgba(255, 255, 255, 0.86); max-width: 300px; }
  .overlay p.sub, .overlay p.soon, .overlay p.a2hs { font-size: 12.5px; color: rgba(255, 255, 255, 0.6); }
  .overlay p.a2hs { color: #9be7ff; }
  .overlay p.build { font-size: 11.5px; color: rgba(255, 255, 255, 0.5); letter-spacing: 0.04em; }
  .overlay p[hidden] { display: none; }

  .card {
    width: min(66vw, 280px); padding: 14px 14px; border-radius: 18px;
    background: linear-gradient(160deg, rgba(255, 79, 163, 0.22), rgba(90, 200, 255, 0.14));
    border: 1.5px solid rgba(255, 255, 255, 0.28);
  }
  .card .k { font-size: 11px; font-weight: 800; letter-spacing: 0.24em; color: #ffc93c; }
  .card .n { font-size: 24px; font-weight: 900; margin: 2px 0 4px; }
  .card .d { font-size: 13px; color: rgba(255, 255, 255, 0.78); }

  .btn {
    min-width: 210px; padding: 13px 26px; border-radius: 999px; border: 2px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.1); color: #fff; font: inherit; font-size: 17px; font-weight: 800;
  }
  .btn.primary {
    border: 0; padding: 16px 26px; font-size: 21px; color: #2a0f1f;
    background: linear-gradient(180deg, #ffd86b, #ff9f1a); box-shadow: 0 5px 0 #a85d00, 0 10px 26px rgba(255, 159, 26, 0.45);
  }
  .btn.ghost { border-color: transparent; background: none; color: rgba(255, 255, 255, 0.7); font-size: 15px; padding: 8px 26px; }
  .btn:active { transform: translateY(2px); }
  .btn:disabled { opacity: 0.45; }
  .stage-row { display: flex; align-items: center; gap: 7px; }
  .nav {
    width: 36px; height: 52px; border-radius: 12px; border: 1.5px solid rgba(255, 255, 255, 0.45); padding: 0;
    background: rgba(255, 255, 255, 0.12); color: #fff; font: inherit; font-size: 28px; font-weight: 900; line-height: 1;
  }
  .nav:disabled { opacity: 0.22; }

  .wallet { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 900; }
  .wallet.big { font-size: 34px; color: #ffd43b; }
  .coin { display: inline-block; width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe9a3, #ffc93c 55%, #c98a00); box-shadow: inset 0 0 0 2px #a86a00; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="btnPause" aria-label="Pause" hidden>II</button>
<button id="btnShake" aria-label="Shake the bar" hidden>Shake</button>

<section id="title" class="overlay show">
  <h1 class="neon">Top Shelf</h1>
  <p class="tag">Slide · Clink · Merge</p>
  <div class="stage-row">
    <button id="btnPrevStage" class="nav" aria-label="Previous stage">&lsaquo;</button>
    <div class="card">
      <div class="k" id="stageK">STAGE 1</div>
      <div class="n" id="stageName"></div>
      <div class="d" id="stageBlurb"></div>
      <div class="levels" id="levels"></div>
    </div>
    <button id="btnNextStage" class="nav" aria-label="Next stage">&rsaquo;</button>
  </div>
  <button id="btnPlay" class="btn primary">Play</button>
  <div class="wallet"><i class="coin"></i><span id="titleCoins">0</span></div>
  <p class="soon" id="soon"></p>
  <p class="build" id="build"></p>
  <p class="a2hs" id="a2hs" hidden>Tip: tap Share, then "Add to Home Screen" to play full-screen.</p>
</section>

<section id="pause" class="overlay">
  <h2>Paused</h2>
  <button id="btnResume" class="btn primary">Resume</button>
  <button id="btnRestart" class="btn">Restart level</button>
  <button id="btnMusic" class="btn">Music: On</button>
  <button id="btnSfx" class="btn">Sound: On</button>
  <button id="btnQuit" class="btn ghost">Main menu</button>
</section>

<section id="lost" class="overlay">
  <h2>Last call!</h2>
  <p>The bar got too crowded.</p>
  <p class="sub" id="lostInfo"></p>
  <button id="btnRetry" class="btn primary">Try again</button>
  <button id="btnLostQuit" class="btn ghost">Main menu</button>
</section>

<section id="clear" class="overlay clear">
  <h2 class="gold" id="clearTitle">Level Clear!</h2>
  <p id="clearInfo"></p>
  <div class="wallet big"><i class="coin"></i><span id="clearCoins">+0</span></div>
  <button id="btnNext" class="btn primary">Next level</button>
  <button id="btnAgain" class="btn">Replay level</button>
  <button id="btnClearQuit" class="btn ghost">Main menu</button>
  <p class="soon" id="clearSoon"></p>
</section>

<div id="probe"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
